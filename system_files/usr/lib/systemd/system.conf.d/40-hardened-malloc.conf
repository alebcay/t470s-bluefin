# Preload hardened_malloc (light) and no_rlimit_as into every service started
# by the system manager. /etc/ld.so.preload is root-only readable, so this
# environment variable is what carries the preload to unprivileged processes.
[Manager]
DefaultEnvironment="LD_PRELOAD=libhardened_malloc-light.so libno_rlimit_as.so"

# Reduce kernel attack surface by blacklisting unused modules.
# Curated for the ThinkPad T470s: never blacklist i915, iwlwifi/iwlmvm,
# thinkpad_acpi, thunderbolt, nvme or xhci_* (required for display, WiFi,
# hotkeys/dock, TB3 dock, disk and USB).
blacklist firewire-core
blacklist firewire-ohci
blacklist floppy
blacklist pcspkr
blacklist appletalk
blacklist ax25
blacklist netrom
blacklist rose
blacklist x25
blacklist can
blacklist atm
blacklist decnet
blacklist ieee802154
